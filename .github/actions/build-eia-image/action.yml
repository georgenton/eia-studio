name: Build and smoke the EIA Studio image
description: >
  Builds the application image from the repository Dockerfile and proves, against that image,
  that the web process starts and reports the commit it was built from and that the worker can
  read a PDF. One definition, used by the pull-request gate and by the publish job, so the two
  cannot drift.

inputs:
  git-sha:
    description: Commit being built; baked in and asserted by the smoke test.
    required: true
  build-id:
    description: Build identifier for the OCI version label.
    required: true
  push:
    description: '"true" publishes to GHCR; "false" loads the image into the local daemon only.'
    required: true
  image-name:
    description: Registry repository, used only when pushing.
    required: false
    default: ""

outputs:
  digest:
    description: Image digest; empty when the image was not pushed.
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v3

    - name: Build
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        # The OVH host is x86_64. Building arm64 under emulation would double the time for an
        # architecture nothing deploys.
        platforms: linux/amd64
        push: ${{ inputs.push == 'true' }}
        # A pull request keeps the image in the local daemon so it can be run and never leaves
        # the runner. Attestations need the registry exporter, so they are published only.
        load: ${{ inputs.push != 'true' }}
        provenance: ${{ inputs.push == 'true' }}
        sbom: ${{ inputs.push == 'true' }}
        tags: ${{ inputs.push == 'true' && format('{0}:{1}', inputs.image-name, inputs.git-sha) || 'eia-studio:ci' }}
        build-args: |
          GIT_SHA=${{ inputs.git-sha }}
          BUILD_ID=${{ inputs.build-id }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Smoke the image that was just built
      shell: bash
      env:
        PUSHED: ${{ inputs.push }}
        REF: ${{ inputs.push == 'true' && format('{0}@{1}', inputs.image-name, steps.build.outputs.digest) || 'eia-studio:ci' }}
        EXPECTED_SHA: ${{ inputs.git-sha }}
      run: |
        set -euo pipefail
        echo "smoking $REF"
        docker run -d --name eia-smoke -p 3000:3000 \
          -e APP_ENV=test -e PUBLIC_APP_URL=http://localhost:3000 "$REF"

        # A bounded wait for the process to bind, not a retry of a failing request: if /health
        # never answers the loop ends and the step fails. No attempt is silently swallowed.
        ok=""
        for _ in $(seq 1 30); do
          if curl -fsS --max-time 3 http://localhost:3000/health -o /tmp/health.json; then ok=1; break; fi
          sleep 2
        done
        if [ -z "$ok" ]; then
          echo "::error::/health never answered"
          docker logs eia-smoke || true
          exit 1
        fi

        cat /tmp/health.json; echo
        # The build argument must reach the running process, not just the build stage. This
        # assertion exists because it once did not.
        grep -q "\"gitSha\":\"$EXPECTED_SHA\"" /tmp/health.json \
          || { echo "::error::/health reports a different commit than the one built"; exit 1; }
        # Non-root runtime, asserted rather than assumed.
        test "$(docker exec eia-smoke id -un)" = node \
          || { echo "::error::container is not running as the node user"; exit 1; }
        # No configuration file may travel inside the image.
        test -z "$(docker exec eia-smoke sh -c 'find /app -maxdepth 4 -name ".env*" 2>/dev/null')" \
          || { echo "::error::an .env file is present inside the image"; exit 1; }

        docker rm -f eia-smoke >/dev/null
        echo "web starts, /health reports $EXPECTED_SHA, runs as node, carries no .env"

    # The web process starting proves nothing about the worker, and the worker is where documents
    # are read. Staging demonstrated the gap: a valid PDF produced `the file could not be read`
    # from a published image, while every test in this repository passed — because all of them
    # resolve pdf.js from the *workspace*, and the question that matters is what the *artefact*
    # can do. So the artefact is asked, before its digest is published.
    #
    # The entry point ships in the image (apps/worker/src/pdf-smoke.ts): it builds its own
    # one-page fixture and calls the same `extractPdf` the extraction consumer calls. Nothing is
    # mounted in, because a script mounted at test time would prove that some Node process can
    # read a PDF rather than that this image can.
    #
    # It fails on either half of the defect it exists for: a missing `@napi-rs/canvas` throws
    # `ReferenceError: DOMMatrix is not defined` at import, and a missing `pdf.worker.mjs` fails
    # `getDocument` with "Setting up fake worker failed". Both were reproduced against the
    # published image before this step was written.
    - name: Prove the image can extract a PDF
      shell: bash
      env:
        REF: ${{ inputs.push == 'true' && format('{0}@{1}', inputs.image-name, steps.build.outputs.digest) || 'eia-studio:ci' }}
      run: |
        set -euo pipefail
        echo "extracting from $REF"
        # No network, no environment: extraction of a fixture needs neither, and a run that
        # could reach one would be a weaker claim about the image.
        docker run --rm --network none --entrypoint node "$REF" \
          apps/worker/dist/pdf-smoke.js | tee /tmp/pdf-smoke.json
        grep -q '"ok":true' /tmp/pdf-smoke.json \
          || { echo "::error::the image cannot extract text from a PDF"; exit 1; }
        echo "pdf.js loads inside the image and getTextContent returns native text"
        # Informational, and recorded here because pdf.js and its native canvas package are
        # roughly 70 MB of this number (TD-123). A build that doubled it should be visible in
        # the log of the run that did it, not discovered later.
        docker image inspect "$REF" --format '{{.Size}}' \
          | awk '{ printf "image size: %d bytes (%.1f MiB)\n", $1, $1/1048576 }'

    # The second native module, and the same question. A published photograph is a **derivative**:
    # the upload is decoded and encoded again so no EXIF — no GPS, no camera, no timestamp — is
    # written at all. That re-encode is sharp, and the first run of this step against the image
    # found that nothing in it could load sharp: the standalone trace carried the package into
    # `.pnpm` with the right platform binary, and no process resolved it, from `/app`, from
    # `/app/apps/web`, or from the worker bundle. Publishing a photograph would have failed in
    # the artefact while passing every test in the workspace — the pdf.js defect again, caught
    # this time before a digest existed. The Dockerfile links it; this keeps it linked.
    - name: Prove the image can publish a photograph without its metadata
      shell: bash
      env:
        REF: ${{ inputs.push == 'true' && format('{0}@{1}', inputs.image-name, steps.build.outputs.digest) || 'eia-studio:ci' }}
      run: |
        set -euo pipefail
        echo "building a derivative inside $REF"
        docker run --rm --network none --entrypoint node "$REF" \
          apps/worker/dist/image-smoke.js | tee /tmp/image-smoke.json
        grep -q '"ok":true' /tmp/image-smoke.json \
          || { echo "::error::the image cannot produce a publishable photograph"; exit 1; }
        grep -q '"exifAfter":false' /tmp/image-smoke.json \
          || { echo "::error::the derivative produced inside the image still carries EXIF"; exit 1; }
        echo "sharp loads inside the image and the derivative carries no EXIF"
