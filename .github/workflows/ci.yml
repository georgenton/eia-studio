# EIA Studio — CI quality gates (docs/CI.md, Stages A–C).
# "quality" is the required status check for branch protection and must keep its name.
# "db" runs migrations, extension verification, RLS and the cross-tenant harness via Testcontainers.
name: ci

# One run per commit, not two.
#
# `push: ["**"]` beside `pull_request` meant every commit on a branch with an open PR built the
# same code twice — measured on PR #48's head `6fbb39b`, which produced runs 35380531656 (push)
# and 35380537345 (pull_request), each running quality, db and e2e to completion. Roughly fifteen
# minutes of identical work per commit, and two green ticks that proved one thing.
#
# The fix is the trigger, not the jobs: a PR branch is covered by `pull_request`, and `main` — which
# has no PR of its own once a merge lands — is covered by `push`. Coverage is unchanged.
#
# Deliberately not done: querying the API for "does this branch have an open PR?". That is a
# condition evaluated per job, in a step, after the runner has already started — it saves nothing
# and adds a failure mode.
on:
  pull_request:
  push:
    branches:
      - main

# Unchanged, and correct after the trigger change rather than by coincidence.
#
# `github.ref` is `refs/pull/N/merge` for a pull_request event and `refs/heads/main` for a push to
# main, so the two can never share a group: a feature branch cannot cancel a main run. Pushing a new
# commit to an open PR raises a second `pull_request` event with the *same* ref, which is exactly
# the run that should be cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          echo "::group::Committed secrets or build artefacts"
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v -E '\.example$' ; then
            echo "::error::.env files with values must not be committed"; fail=1; fi
          if git ls-files | grep -E '(^|/)node_modules/' ; then
            echo "::error::node_modules must not be committed"; fail=1; fi
          if git ls-files | grep -E '\.(pem|p12|key)$' ; then
            echo "::error::private key material must not be committed"; fail=1; fi
          if git ls-files | grep -E '^(package-lock\.json|yarn\.lock)$' ; then
            echo "::error::only pnpm-lock.yaml is allowed"; fail=1; fi
          echo "::endgroup::"
          echo "::group::Documentation set present"
          for f in CLAUDE.md docs/README.md docs/ARCHITECTURE.md docs/TENANCY.md docs/FEATURES.md \
                   docs/SECURITY.md docs/PROVENANCE.md docs/ENGINEERING_STANDARDS.md docs/CI.md \
                   docs/DEPLOYMENT.md docs/RELEASE_POLICY.md docs/TECH_DEBT.md docs/DECISIONS/GATE-1.md; do
            [ -f "$f" ] || { echo "::error::missing $f"; fail=1; }
          done
          echo "::endgroup::"
          exit $fail

      - name: Conventional Commit PR title
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          types='feat|fix|docs|chore|refactor|test|perf|build|ci|revert'
          scopes='core|projects|gis|field|social|quality|documents|pgas|reports|portal|ai|provenance|audit|tenancy|db|ui|web|worker|fixtures|docs|contracts|config|testing|deps|release'
          if [[ "$PR_TITLE" =~ ^($types)(\(($scopes)\))?!?:\ [^[:space:]].{0,71}$ ]]; then
            echo "PR title OK: $PR_TITLE"
          else
            echo "::error::PR title must follow Conventional Commits with a known scope: type(scope): subject"
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint (ESLint + forbidden pilot constants)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and domain tests
        run: pnpm test:unit

      - name: Build (web + worker)
        run: pnpm build

      - name: Changeset status (advisory)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

  db:
    name: db
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Migration drift check (drizzle-kit generate produces nothing)
        run: pnpm db:check

      - name: Integration tests — migrations, extensions, RLS, cross-tenant harness, domain context
        run: pnpm test:integration
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node (from .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL (PostGIS + pgvector, same image as local and CI integration)
        run: |
          docker build -t eia-studio/postgres:ci docker/postgres
          docker run -d --name eia-e2e-db -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=eia_studio \
            eia-studio/postgres:ci
          for i in $(seq 1 60); do
            docker exec eia-e2e-db pg_isready -U postgres && break
            sleep 2
          done

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare database, fixtures and synthetic identities
        run: pnpm e2e:prepare
        env: &e2e_env
          APP_ENV: test
          PUBLIC_APP_URL: http://127.0.0.1:3100
          BETTER_AUTH_URL: http://127.0.0.1:3100
          BETTER_AUTH_SECRET: ${{ secrets.E2E_AUTH_SECRET || 'ci-only-secret-not-used-outside-ci-runs' }}
          DATABASE_URL: postgres://eia_app_login:${{ secrets.E2E_APP_PASSWORD || 'ci-only-app-password' }}@127.0.0.1:5432/eia_studio?sslmode=disable
          DATABASE_MIGRATOR_URL: postgres://postgres:postgres@127.0.0.1:5432/eia_studio?sslmode=disable
          DATABASE_APP_ROLE_NAME: eia_app_login
          DATABASE_APP_ROLE_PASSWORD: ${{ secrets.E2E_APP_PASSWORD || 'ci-only-app-password' }}
          DEMO_FIXTURES_ENABLED: "true"
          DEMO_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD || 'ci-only-demo-password' }}

      - name: Demo seeder is idempotent (re-seed changes nothing that exists)
        run: pnpm db:check-seeder-idempotency
        env: *e2e_env

      - name: Build the web application
        run: pnpm --filter @eia/web build
        env: *e2e_env

      - name: End-to-end journey and authorization suite
        run: pnpm e2e
        env: *e2e_env

      - name: Upload the report when the suite fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # The raw evidence, which the HTML report summarises rather than contains: the trace zips
      # Playwright keeps on failure (`trace: retain-on-failure`), the screenshots, and the
      # `error-context.md` page snapshot. Diagnosing TD-118 needed exactly these and they were not
      # retained, so the failure had to be reproduced locally to be looked at.
      #
      # Safe to keep: every environment this suite runs in holds synthetic, PII-free demo data by
      # construction (SECURITY.md §12a), and the artefact expires in seven days on a private
      # repository. It carries no database dump, no environment file and no credential — the web
      # server's own output is already in the job log, which is where it belongs.
      - name: Upload the raw failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
